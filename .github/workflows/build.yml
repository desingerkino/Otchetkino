name: Сборка и тесты
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Выбрать Xcode
        run: |
          ls /Applications | grep -i xcode || true
          # предпочитаем Xcode 16.x (на macos-15), иначе 15.4
          for v in 16.4 16.3 16.2 16.1 16.0 15.4; do
            if [ -d "/Applications/Xcode_$v.app" ]; then sudo xcode-select -s "/Applications/Xcode_$v.app"; break; fi
          done
          xcodebuild -version
      - name: Установить XcodeGen
        run: brew install xcodegen
      - name: Сгенерировать проект
        run: |
          xcodegen generate
          # Xcode 15 (macOS Ventura) читает проекты формата не новее 60
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 56;/' Rekvizit.xcodeproj/project.pbxproj
          sed -i '' -E 's/compatibilityVersion = "[^"]*";/compatibilityVersion = "Xcode 14.0";/' Rekvizit.xcodeproj/project.pbxproj
          sed -i '' -E '/preferredProjectObjectVersion/d' Rekvizit.xcodeproj/project.pbxproj
          head -12 Rekvizit.xcodeproj/project.pbxproj
          grep -n "PBXFileSystemSynchronized" Rekvizit.xcodeproj/project.pbxproj | head -3 || true
      - name: Тесты (macOS)
        run: |
          set -o pipefail
          xcodebuild test -project Rekvizit.xcodeproj -scheme Rekvizit-macOS -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee test.log | grep -E "error:|warning: unre|Test Case|Executed|TEST (SUCCEEDED|FAILED)|BUILD" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Сборка iOS (симулятор)
        run: |
          set -o pipefail
          xcodebuild build -project Rekvizit.xcodeproj -scheme Rekvizit-iOS -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee ios.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" ios.log
      - name: Проверить Excel независимым читателем (openpyxl)
        run: |
          pip3 install --break-system-packages openpyxl pillow >/dev/null 2>&1 || pip3 install openpyxl pillow >/dev/null 2>&1
          python3 - <<'PY'
          import openpyxl
          wb = openpyxl.load_workbook('/tmp/rekvizit-samples/sample-report.xlsx')
          print(wb.sheetnames)
          for ws in wb.worksheets:
              print(ws.title, ws.dimensions, 'images:', len(ws._images), 'merged:', len(ws.merged_cells.ranges))
          assert wb.sheetnames == ['Сводный отчёт', 'Детализация расходов', 'Реестр чеков', 'Фотографии чеков']
          assert len(wb['Детализация расходов']._images) == 3
          assert len(wb['Фотографии чеков']._images) == 4
          PY
      - name: Сборка Mac (универсальная, для запуска без подписи Apple)
        run: |
          set -o pipefail
          xcodebuild build -project Rekvizit.xcodeproj -scheme Rekvizit-macOS -configuration Local -destination 'generic/platform=macOS' \
            -derivedDataPath build ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64" CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES 2>&1 | tail -5
          cd build/Build/Products/Local && lipo -archs Rekvizit.app/Contents/MacOS/Rekvizit && codesign -dv Rekvizit.app 2>&1 | head -3
          ditto -c -k --keepParent Rekvizit.app "$GITHUB_WORKSPACE/Rekvizit-macOS-local.zip"
          # дымовой запуск: приложение должно открыться и не упасть
          ./Rekvizit.app/Contents/MacOS/Rekvizit > "$GITHUB_WORKSPACE/launch.log" 2>&1 &
          APP_PID=$!
          sleep 10
          screencapture -x "$GITHUB_WORKSPACE/mac-launch.png" || true
          if kill -0 $APP_PID 2>/dev/null; then echo "Приложение запущено и работает"; kill $APP_PID; else echo "ПРИЛОЖЕНИЕ УПАЛО ПРИ ЗАПУСКЕ"; cat "$GITHUB_WORKSPACE/launch.log"; exit 1; fi
      - name: Сборка iPhone .ipa (без подписи, для установки через Sideloadly/AltStore)
        run: |
          set -o pipefail
          xcodebuild build -project Rekvizit.xcodeproj -scheme Rekvizit-iOS -configuration Local -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -3
          mkdir -p ipa/Payload && cp -R build-ios/Build/Products/Local-iphoneos/Rekvizit.app ipa/Payload/
          (cd ipa && zip -qr "$GITHUB_WORKSPACE/Rekvizit-iOS-unsigned.ipa" Payload)
          ls -la Rekvizit-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Rekvizit-macOS-and-samples
          path: |
            Rekvizit-macOS-local.zip
            mac-launch.png
            launch.log
            /tmp/rekvizit-samples/*
      - name: Выложить сборку и примеры в релиз
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Последняя сборка" --notes "Автоматическая сборка из ветки main. Mac-приложение без подписи Apple (без iCloud) и примеры отчётов."
          gh release upload latest Rekvizit-iOS-unsigned.ipa Rekvizit-macOS-local.zip /tmp/rekvizit-samples/sample-report.xlsx /tmp/rekvizit-samples/sample-report.pdf --clobber
      - name: Сохранить сгенерированный Xcode-проект в репозиторий
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f Rekvizit.xcodeproj
          if ! git diff --cached --quiet; then git commit -m "Обновить сгенерированный Rekvizit.xcodeproj [skip ci]" && git push; fi
